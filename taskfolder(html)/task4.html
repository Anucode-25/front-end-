<body>
    <header> <h1 align="center"> JOB APPLICATION FORM</h1></header>
   
    <fieldset>
        <legend><b>Personal details</b></legend>
        <form>
        <label>FULL NAME</label>
        <input type="text" placeholder="Enter your name" maxlength="20"size="30" ><br><br>&nbsp;
        <label>DOB</label>
        <input type="date"><br><br>
        <label>GENDER</label>
        <input type="radio"value="male" name="gender">MALE
        <input type="radio" value="female" name="gender">FEMALE<br><br>
        <label >EMAIL ID</label>
        <input type="email" placeholder="Enter your email ID" maxlength="50" size="30"><br><br>
        <label>PHONE NUMBER</label>
        <input type="tel" placeholder="Enter the phone number" maxlength="10" size="30" ><br><br>
        <label>PERMANENT ADDRESS</label><br>
        <textarea rows="8" cols="50">
        </textarea>
    </fieldset>
    </form>
    <fieldset>
        <legend><b>Education qualifications</b></legend>
        <form>
            <label>University name</label>
            <input type="text" placeholder="enter your university"><br><br>
            <label>Select degree level</label>
            <select>
                <option>select your degree level</option>
                <option>High School Diploma/GED</option>
                <option>Associate Degree</option>
                <option>Bachelor's Degree</option>
                <option>Master's Degree</option>
                <option>Doctorate/Ph.D</option>
                <option>Other</option>
            </select><br><br>
            <label>Field of Study</label>
            <select>
                <option>select your field</option>
                <option>Computer Science & Information Technology  </option>
                <option>Business Administration & Management </option>
                <option>Engineering </option>
                <option>Communications & Media Studies</option>
                <option>Humanities & Social Sciences </option>
            </select><br><br>
            <label>Graduation Timeline</label>
            <input type="date"><br><br>
            <label>Additional Achievements</label><br>
            <textarea rows="5" cols="40"></textarea>
        </form>
    </fieldset>
    <fieldset>
        <legend>
            <b>Skills</b>
        </legend>
        <form>
            <label>Key skills</label>
            <input type="checkbox" value="HTML" name="skills">HTML
            <input type="checkbox" value="CSS" name="skills">CSS
            <input type="checkbox" value="JAVASCRIPT" name="skills">JAVASCRIPT
            <input type="checkbox" value="BOOTSTRAP" name="skills">BOOTSTRAP
            <input type="checkbox" value="SQL" name="skills">SQL
            <input type="checkbox" value="JAVA" name="skills">JAVA
            <input type="checkbox" value="REACT JS" name="skills">REACT JS
            <input type="checkbox" value="NODE JS" name="skills">NODE JS
            <br><br>
            <label>Language Spoken</label>
            <input type="text"><br><br>
            <label>Language  name</label>
            <input type="text">
            <select>
                <option>-----</option>
                <option>beginner</option>
                <option>intermediate</option>
                <option>professional</option>
            </select><br><br>
            <label>Language  name</label>
            <input type="text">
            <select>
                <option>-----</option>
                <option>beginner</option>
                <option>intermediate</option>
                <option>professional</option>
            </select>
        </form>
    </fieldset>
    <footer>
             <label>UPLOAD RESUME</label>
             <input type="file"accept=".pdf,.jpg,">
             <br><br>
            <button type="submit">SUBMIT</button>
            <button type="reset">RESET</button>
        </footer>
